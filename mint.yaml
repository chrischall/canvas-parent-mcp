version: 1
name: Canvas Parent
slug: canvas-parent
summary: >-
  Canvas LMS courses, assignments, grades and messages for a parent/observer.
  The package ships TWO bins, so command.bin below is required — without it the
  install refuses. A token or OAuth registration hosts on any tier; the
  username/password and bridge paths need a browser and do not.
command:
  # REQUIRED: package.json declares canvas-parent-mcp (the server) and
  # canvas-parent-mcp-qr-login (a local CLI). Without this the install refuses.
  bin: canvas-parent-mcp
env:
  - name: CANVAS_BASE_URL
    required: true
    help: >-
      Your district's Canvas host, e.g. https://cms.instructure.com. Must be an
      https URL. Everything else is an auth mode on top of this.
  - name: CANVAS_TOKEN
    secret: true
    required: false
    help: >-
      A Canvas personal access token (Account → Settings → New Access Token).
      The simplest hosted auth mode; tried first.
  - name: CANVAS_CLIENT_ID
    required: false
    help: OAuth client id. Use with CANVAS_CLIENT_SECRET + CANVAS_REFRESH_TOKEN.
  - name: CANVAS_CLIENT_SECRET
    secret: true
    required: false
    help: OAuth client secret. Use with CANVAS_CLIENT_ID + CANVAS_REFRESH_TOKEN.
  - name: CANVAS_REFRESH_TOKEN
    secret: true
    required: false
    help: OAuth refresh token. Use with CANVAS_CLIENT_ID + CANVAS_CLIENT_SECRET.
  - name: CANVAS_USERNAME
    required: false
    help: >-
      Canvas login email, for the session-scrape mode (direct Canvas accounts
      only — not SSO). Prefer CANVAS_TOKEN when hosted.
  - name: CANVAS_PASSWORD
    secret: true
    required: false
    help: Canvas password, paired with CANVAS_USERNAME. Prefer CANVAS_TOKEN when hosted.
  - name: CANVAS_NAME
    required: false
    help: Label for this district. Defaults to the host portion of CANVAS_BASE_URL.
  - name: CANVAS_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 1 to disable the browser-bridge fallback, making missing
      credentials a hard error. Recommended for a hosted registration, which has
      no browser to fall back to.
  - name: CANVAS_SESSION_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk session cache and authenticate on
      every process start. Defaults to enabled.
  - name: CANVAS_SESSION_FILE
    required: false
    help: >-
      Absolute path for the session cache file. Defaults to
      $MCP_DATA_DIR/.canvas-parent-mcp/session.json.
egress:
  allow:
    # Only hosts the SERVER process actually fetches; hosts that appear solely
    # in a URL this server builds and returns are excluded. Matching is EXACT:
    # an apex entry covers no subdomain, and `*.` covers labels beneath it but
    # not the apex — which is why the wildcard below is a wildcard.
    #
    # Canvas is multi-tenant per district: CANVAS_BASE_URL is a
    # <district>.instructure.com host (cms.instructure.com is the CMS district)
    # and every API call, the form login and the OAuth refresh go to it.
    # Narrow the wildcard to YOUR district's host if you prefer. A self-hosted
    # Canvas (a CANVAS_BASE_URL outside instructure.com) is env-selected and
    # must be added here by hand.
    #
    # canvas_download_file follows the file URL Canvas returns, and a hosted
    # district's download 302s to Instructure's file store, whose host carries
    # the region (inst-fs-iad-prod.inscloudgate.net, -dub-, -syd-, …). The
    # exact host is discovered at runtime, hence the wildcard.
    #
    # sso.canvaslms.com is deliberately NOT here: the hosted server never
    # contacts it. session-login.ts only INSPECTS a redirect's Location for
    # that host, and qr-login.ts is the separate canvas-parent-mcp-qr-login
    # bin, not the child this manifest configures. The fetchproxy fallback
    # lifts cookies through the browser bridge, which is not a dial either.
    - "*.instructure.com"
    - cms.instructure.com
    - "*.inscloudgate.net"

state:
  dataDir: true
  reason: >-
    Caches the signed-in session at
    $MCP_DATA_DIR/.canvas-parent-mcp/session.json (0600). Without it every cold
    start re-runs the form login (session mode) or spends a refresh-token
    exchange against Canvas (oauth mode); a hosted child idles out after ten
    minutes, so that is most starts. Token mode caches nothing.
